name: marine_assistant
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.2.0
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/logo/
    - assets/image/


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/appIcon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#021B2D"
  image: "assets/logo/splash_orbit.png"
  android: true
  ios: true
  android_12:
    color: "#021B2D"
    image: "assets/logo/splash_orbit.png"
